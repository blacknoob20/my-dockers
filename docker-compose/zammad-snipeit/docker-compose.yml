x-hc:
  &hc-defaults
  interval: 10s
  timeout: 5s
  start_period: 30s

x-zammad-env: &zammad-env
  env_file: ./envs/zammad-app.env

services:
  # --- INFRAESTRUCTURA GESTIÓN DE ACTIVOS: SNIPE-IT ---
  snipe-db:
    image: mariadb:10.11
    env_file: ./envs/snipe-db.env
    volumes:
      - ./snipe-data/db:/var/lib/mysql
    networks:
      - net
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      <<: *hc-defaults
      retries: 10

  snipe-it:
    image: snipe/snipe-it:latest-alpine
    ports:
      - "8080:80"
    env_file: ./envs/snipe-it.env
    volumes:
      - ./snipe-data/uploads:/var/www/html/public/uploads
    depends_on:
      snipe-db:
        condition: service_healthy
    networks:
      - net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      <<: *hc-defaults
      retries: 5

  # --- INFRAESTRUCTURA MESA DE AYUDA: ZAMMAD ---
  zammad-db:
    image: postgres:15-alpine
    env_file: ./envs/zammad-db.env
    volumes:
      - ./zammad-data/db:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      <<: *hc-defaults
      retries: 10

  zammad-search:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.16.0
    env_file: ./envs/zammad-search.env
    volumes:
      # Named volume: el contenedor corre como uid 1000 (elasticsearch) pero
      # los bind mounts se crean como root → "Permission denied" en node.lock.
      # Docker gestiona el ownership automáticamente con named volumes.
      - zammad-search-data:/usr/share/elasticsearch/data
    networks:
      - net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  zammad-redis:
    image: redis:7-alpine
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zammad-init:
    image: zammad/zammad:6.2.0-28
    command: ["zammad-init"]
    <<: *zammad-env
    volumes:
      # Named volume: Zammad corre como uid 1000 (zammad) pero los bind mounts
      # se crean como root → "Permission denied" en zammad.ready.
      # Un named volume comparte datos entre init, railsserver, scheduler,
      # websocket y nginx sin conflictos de permisos.
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-db:
        condition: service_healthy
      zammad-search:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
    networks:
      - net

  zammad-railsserver:
    image: zammad/zammad:6.2.0-28
    command: ["zammad-railsserver"]
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net

  zammad-scheduler:
    image: zammad/zammad:6.2.0-28
    command: ["zammad-scheduler"]
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net

  zammad-websocket:
    image: zammad/zammad:6.2.0-28
    command: ["zammad-websocket"]
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net

  zammad-nginx:
    image: zammad/zammad:6.2.0-28
    command: ["zammad-nginx"]
    ports:
      - "8000:8080"
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      - zammad-railsserver
      - zammad-scheduler
      - zammad-websocket
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      <<: *hc-defaults
      retries: 5
    networks:
      - net

  # --- INFRAESTRUCTURA AUTOMATIZACIÓN: N8N ---
  n8n-db:
    image: postgres:15-alpine
    env_file: ./envs/n8n-db.env
    volumes:
      - ./n8n-data/db:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      <<: *hc-defaults
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    env_file: ./envs/n8n.env
    volumes:
      # Named volume: n8n corre como uid 1000 (node) pero el bind mount
      # se crea como root → "EACCES: permission denied" en config.
      - n8n-home-data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    networks:
      - net

# Named volumes para servicios que corren como uid 1000 y no pueden
# escribir en bind mounts (creados como root por el host).
volumes:
  zammad-search-data:   # Elasticsearch indices
  zammad-var-data:      # Zammad internal files (shared por init/rails/scheduler/ws/nginx)
  n8n-home-data:        # n8n config y workflows

networks:
  net:
    driver: bridge
