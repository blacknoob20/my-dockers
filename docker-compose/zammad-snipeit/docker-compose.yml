x-hc: &hc-defaults
  interval: 10s
  timeout: 5s
  start_period: 30s

x-zammad-env: &zammad-env
  env_file: ./envs/zammad-app.env

services:
  # --- INFRAESTRUCTURA GESTIÓN DE ACTIVOS: SNIPE-IT ---
  # snipe-db: usa docker-mariadb-1 (red docker_net) — ejecutar ./scripts/init-external-dbs.sh
  # snipe-db:
  #   image: mariadb:10.11
  #   env_file: ./envs/snipe-db.env
  #   volumes:
  #     - ./snipe-data/db:/var/lib/mysql
  #   networks:
  #     - net
  #   healthcheck:
  #     test:
  #       [
  #         "CMD",
  #         "healthcheck.sh",
  #         "--su-mysql",
  #         "--connect",
  #         "--innodb_initialized",
  #       ]
  #     <<: *hc-defaults
  #     retries: 10

  snipe-it:
    image: snipe/snipe-it:latest-alpine
    ports:
      - "8080:80"
    env_file: ./envs/snipe-it.env
    volumes:
      - ./snipe-data/uploads:/var/www/html/public/uploads
    depends_on: {}
    networks:
      - net
      - docker_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      <<: *hc-defaults
      retries: 5

  # --- INFRAESTRUCTURA MESA DE AYUDA: ZAMMAD ---
  # zammad-db: usa docker-postgres-1 (red docker_net) — ejecutar ./scripts/init-external-dbs.sh
  # zammad-db:
  #   image: postgres:17-alpine
  #   env_file: ./envs/zammad-db.env
  #   volumes:
  #     - ./zammad-data/db:/var/lib/postgresql/data
  #   networks:
  #     - net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U zammad_user -d zammad_production"]
  #     <<: *hc-defaults
  #     retries: 10

  zammad-search:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.16.0
    env_file: ./envs/zammad-search.env
    volumes:
      # Named volume: el contenedor corre como uid 1000 (elasticsearch) pero
      # los bind mounts se crean como root → "Permission denied" en node.lock.
      # Docker gestiona el ownership automáticamente con named volumes.
      - zammad-search-data:/usr/share/elasticsearch/data
    networks:
      - net
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  zammad-redis:
    image: redis:7-alpine
    networks:
      - net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zammad-memcached:
    image: memcached:1.6.42-alpine
    command: memcached -m 256M
    networks:
      - net
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "11211" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  zammad-init:
    image: ghcr.io/zammad/zammad:latest
    command: [ "zammad-init" ]
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-search:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy
    networks:
      - net
      - docker_net

  zammad-railsserver:
    image: ghcr.io/zammad/zammad:latest
    command: [ "zammad-railsserver" ]
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net
      - docker_net

  zammad-scheduler:
    image: ghcr.io/zammad/zammad:latest
    command: [ "zammad-scheduler" ]
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net
      - docker_net

  zammad-websocket:
    image: ghcr.io/zammad/zammad:latest
    command: [ "zammad-websocket" ]
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net
      - docker_net

  zammad-nginx:
    image: ghcr.io/zammad/zammad:latest
    command: [ "zammad-nginx" ]
    ports:
      - "8000:8080"
    <<: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
      - zammad-storage:/opt/zammad/storage
    depends_on:
      - zammad-railsserver
      - zammad-scheduler
      - zammad-websocket
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      <<: *hc-defaults
      retries: 5
    networks:
      - net
      - docker_net

  zammad-backup:
    image: ghcr.io/zammad/zammad:latest
    command: [ "zammad-backup" ]
    <<: *zammad-env
    user: "0:0"
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage
    depends_on: {}
    networks:
      - net
      - docker_net

  # --- INFRAESTRUCTURA AUTOMATIZACIÓN: N8N ---
  # n8n-db: usa docker-postgres-1 (red docker_net) — ejecutar ./scripts/init-external-dbs.sh
  # n8n-db:
  #   image: postgres:17-alpine
  #   env_file: ./envs/n8n-db.env
  #   volumes:
  #     - ./n8n-data/db:/var/lib/postgresql/data
  #   networks:
  #     - net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U n8n_user -d n8n"]
  #     <<: *hc-defaults
  #     retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
      # - "5679:5679"  # Puerto del task broker (solo necesario con n8n-runner)
    env_file: ./envs/n8n.env
    # environment:  # Solo necesario con n8n-runner
    #   - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    volumes:
      # Named volume: n8n corre como uid 1000 (node) pero el bind mount
      # se crea como root → "EACCES: permission denied" en config.
      - n8n-home-data:/home/node/.n8n
    depends_on: {}
    networks:
      - net
      - docker_net
  # --- N8N TASK RUNNER (descomentar en producción) ---
  # Ejecuta código JS/Python de forma aislada del proceso principal de n8n.
  # Requiere: descomentar puerto 5679, N8N_RUNNERS_BROKER_LISTEN_ADDRESS
  # y las variables N8N_RUNNERS_* en envs/n8n.env.
  # Doc: https://docs.n8n.io/hosting/configuration/task-runners/
  # n8n-runner:
  #   image: n8nio/runners
  #   environment:
  #     - N8N_RUNNERS_AUTH_TOKEN=n8n-runner-secret-token
  #     - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
  #   depends_on:
  #     - n8n
  #   networks:
  #     - net

  # Named volumes para servicios que corren como uid 1000 y no pueden
  # escribir en bind mounts (creados como root por el host).
volumes:
  zammad-search-data: # Elasticsearch indices
  zammad-var-data: # Zammad internal files (shared por init/rails/scheduler/ws/nginx)
  zammad-storage: # Archivos adjuntos de tickets
  zammad-backup: # Backups de DB y storage
  n8n-home-data:
    # n8n config y workflows

networks:
  net:
    driver: bridge
  docker_net:
    external: true
