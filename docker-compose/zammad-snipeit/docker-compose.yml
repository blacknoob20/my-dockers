services:
  # --- INFRAESTRUCTURA GESTIÓN DE ACTIVOS: SNIPE-IT ---
  snipe-db:
    image: mariadb:10.11
    container_name: snipe-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_laboratorio
      MYSQL_DATABASE: snipeit
      MYSQL_USER: snipe_user
      MYSQL_PASSWORD: snipe_password_123
    volumes:
      - ./snipe-data/db:/var/lib/mysql
    networks:
      - net
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  snipe-it:
    image: snipe/snipe-it:latest-alpine
    container_name: snipe-it
    ports:
      - "8080:80"
    environment:
      APP_URL: http://localhost:8080
      APP_KEY: base64:tN7v6vH6b7Y89KkJjH6gFdSaQwErTyUiOpAsDfGhJkL= # Clave de lab, cámbiala en producción
      DB_CONNECTION: mysql
      DB_HOST: snipe-db
      DB_DATABASE: snipeit
      DB_USERNAME: snipe_user
      DB_PASSWORD: snipe_password_123
      MAIL_MAILER: log
      MAIL_HOST: ""
      MAIL_PORT: 587
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
      MAIL_FROM_ADDR: "snipe@lab.local"
      MAIL_FROM_NAME: "Snipe-IT Lab"
    volumes:
      - ./snipe-data/uploads:/var/www/html/public/uploads
    depends_on:
      snipe-db:
        condition: service_healthy
    networks:
      - net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- INFRAESTRUCTURA MESA DE AYUDA: ZAMMAD ---
  zammad-db:
    image: postgres:15-alpine
    container_name: zammad-db
    environment:
      POSTGRES_USER: zammad_user
      POSTGRES_PASSWORD: zammad_password_123
      POSTGRES_DB: zammad_production
    volumes:
      - ./zammad-data/db:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad_user -d zammad_production"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zammad-search:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.16.0
    container_name: zammad-search
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g" # Ajuste de RAM
    volumes:
      # Named volume: el contenedor corre como uid 1000 (elasticsearch) pero
      # los bind mounts se crean como root → "Permission denied" en node.lock.
      # Docker gestiona el ownership automáticamente con named volumes.
      - zammad-search-data:/usr/share/elasticsearch/data
    networks:
      - net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  zammad-redis:
    image: redis:7-alpine
    container_name: zammad-redis
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zammad-init:
    image: zammad/zammad:6.2.0-28
    container_name: zammad-init
    command: ["zammad-init"]
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad_user
      - POSTGRESQL_PASS=zammad_password_123
      - POSTGRESQL_DB=zammad_production
      - ELASTICSEARCH_HOST=zammad-search
      - ELASTICSEARCH_PORT=9200
      - REDIS_URL=redis://zammad-redis:6379
    volumes:
      # Named volume: Zammad corre como uid 1000 (zammad) pero los bind mounts
      # se crean como root → "Permission denied" en zammad.ready.
      # Un named volume comparte datos entre init, railsserver, scheduler,
      # websocket y nginx sin conflictos de permisos.
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-db:
        condition: service_healthy
      zammad-search:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
    networks:
      - net

  zammad-railsserver:
    image: zammad/zammad:6.2.0-28
    container_name: zammad-railsserver
    command: ["zammad-railsserver"]
    environment: &zammad-env
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad_user
      - POSTGRESQL_PASS=zammad_password_123
      - POSTGRESQL_DB=zammad_production
      - ELASTICSEARCH_HOST=zammad-search
      - ELASTICSEARCH_PORT=9200
      - REDIS_URL=redis://zammad-redis:6379
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net

  zammad-scheduler:
    image: zammad/zammad:6.2.0-28
    container_name: zammad-scheduler
    command: ["zammad-scheduler"]
    environment: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net

  zammad-websocket:
    image: zammad/zammad:6.2.0-28
    container_name: zammad-websocket
    command: ["zammad-websocket"]
    environment: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - net

  zammad-nginx:
    image: zammad/zammad:6.2.0-28
    container_name: zammad-app
    command: ["zammad-nginx"]
    ports:
      - "8000:8080"
    environment: *zammad-env
    volumes:
      - zammad-var-data:/opt/zammad/var
    depends_on:
      - zammad-railsserver
      - zammad-scheduler
      - zammad-websocket
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - net

  # --- INFRAESTRUCTURA AUTOMATIZACIÓN: N8N ---
  n8n-db:
    image: postgres:15-alpine
    container_name: n8n-db
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: n8n_password_123
      POSTGRES_DB: n8n
    volumes:
      - ./n8n-data/db:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Guayaquil
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=development
      - TZ=America/Guayaquil
    volumes:
      # Named volume: n8n corre como uid 1000 (node) pero el bind mount
      # se crea como root → "EACCES: permission denied" en config.
      - n8n-home-data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    networks:
      - net

# Named volumes para servicios que corren como uid 1000 y no pueden
# escribir en bind mounts (creados como root por el host).
volumes:
  zammad-search-data:   # Elasticsearch indices
  zammad-var-data:      # Zammad internal files (shared por init/rails/scheduler/ws/nginx)
  n8n-home-data:        # n8n config y workflows

networks:
  net:
    driver: bridge
