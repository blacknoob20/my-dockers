services:
  ollama:
    image: alpine/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_MMAP=1
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=2
      - GGML_NUM_THREAD=3
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        # inicia el servidor en background
        ollama serve &
        # espera a que arranque
        sleep 3
        # descarga el modelo si no está
        ollama list | grep -q "LFM2:2.6b" || ollama pull sam860/LFM2:2.6b
        # mantiene el proceso corriendo en foreground
        wait -n
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - net

volumes:
  ollama-data:
networks:
  net:
    driver: bridge
